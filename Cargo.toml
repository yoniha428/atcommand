[package]
name = "atcommand"
version = "0.1.0"
edition = "2024"

authors = ["yoniha428"]
description = "CLI tool for AtCoder"
repository = "https://github.com/yoniha428/atcommand"
license = "MIT"
readme = "README.md"

categories = ["command-line-utilities", "development-tools"]
keywords = ["atcoder", "competitive", "cli"]

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.56", features = ["derive"] }
directories = "6.0.0"
open = "5.3.3"
reqwest = { version = "0.12", features = ["blocking"] }
scraper = "0.25"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.11"

[[bin]]
name = "atc"
path = "src/main.rs"

[dev-dependencies]
assert_cmd = "2.1.2"
httpmock = "0.8.3"
predicates = "3.1.3"
tempfile = "3.24.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
